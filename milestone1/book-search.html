<!DOCTYPE html>
<html>
  <head>
    <title>Book Search</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      body {
        display: grid;
        grid-template-columns: 20% 80%;
        font-family: sans-serif;
        margin: auto;
      }

      .navbox {
        float: left;
        text-align: center;
        background-color: lightgray;
      }

      .navbox h2 {
        background-color: black;
        color: white;
        margin: 0%;
        padding: 1rem 0%;
      }

      .page-banner {
        background-color: darkblue;
        color: white;
        margin: 0%;
        padding: 1rem;
      }

      .page-contents {
        margin-left: 10px;
      }

      #result-list {
        list-style-type: none;
      }
    </style>
  </head>
  <body>
    <div class="navbox">
      <h2>Navigation</h2>
      <p><a href="/index.html">Home</a></p>
      <h3>Lab Work</h3>
      <p><a>Lab 1 (WIP)</a></p>
      <p><a>Lab 2 (WIP)</a></p>
      <h3>Individual Project Milestones</h3>
      <h4>Milestone 1</h4>
      <p><a href="/milestone1/book-data.html">Single-Book Data</a></p>
      <p><a href="/milestone1/book-search.html">Book Search</a></p>
    </div>
    <div>
      <h1 class="page-banner">Book Search</h1>
      <div class="page-contents">
        <ul id="result-list"></ul>
      </div>
    </div>
  </body>
  <script>
    $(document).ready(function(){
        $.getJSON("../openlibrary-search.json", function(data){
            $.each(data.docs, function(index, doc){
                $("<li>").text("Title: " + doc.title).appendTo("#result-list");

                if(doc.author_name.length > 1){
                    let authors = "Authors: ";
                    $.each(doc.author_name, function(index, author){
                        authors += author;
                        if(index < doc.author_name.length - 1){
                            authors += ", ";
                        }
                    })
                    $("<li>").text(authors).appendTo("#result-list");
                }
                else{
                    $("<li>").text("Authors: " + doc.author_name[0]).appendTo("#result-list");
                }
                
                $("<li>").text("First publication year: " + doc.first_publish_year).appendTo("#result-list");
                $("<li>").text("Edition: " + doc.edition_count).appendTo("#result-list");

                if ('cover_i' in doc) {
                    $("<li>").append($("<img>")
                    .attr({"src": "https://covers.openlibrary.org/b/id/" + doc.cover_i + ".jpg", "style": "max-width: 200px;"}))
                    .appendTo("#result-list");
                }

                $("<li>").append($("<a>").attr("href", "https://openlibrary.org" + doc.key)
                    .text("Books's page on Open Library")).appendTo("#result-list");

                $("<br>").appendTo("#result-list");
                $("<br>").appendTo("#result-list");
            })
        });
    });
  </script>
</html>
