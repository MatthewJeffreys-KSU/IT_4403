<!DOCTYPE html>
<html>
  <head>
    <title>Book Search</title>
    <link rel="stylesheet" href="m3styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="m3javascript.js"></script>
  </head>
  <body>
    <h1 class="page-banner">Book Search</h1>
    <div class="page-contents">
        <div class="search-pane">
            <br>
            <input type="text" id="search-text">
            <button type="button" id="search-button">Search</button>
            <br>
            <div id="collections">
              Search collections by subject: 
              <span class="pseudolink" data-subject="history">History</span>&emsp;
              <span class="pseudolink" data-subject="science fiction">Science Fiction</span>
            </div>
            <div class="page-selection">
              <br>
              <label for="page-select">Current page: </label>
              <select id="page-select"></select>
              <br>
            </div>
            <div id="search-results"></div>
        </div>
        <div class="details-pane">
            <ul id="details-list"></ul>
        </div>
    </div>
  </body>
</html>
