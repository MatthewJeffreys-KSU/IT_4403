<!DOCTYPE html>
<html>
  <head>
    <title>Book Details</title>
    <link rel="stylesheet" href="m2styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <div class="navbox">
      <h2>Navigation</h2>
      <p><a href="../index.html">IT 4403 Home</a></p>
      <p><a href="book-search-home.html">Home</a></p>
      <p><a href="my-bookshelf.html">My Bookshelf</a></p>
    </div>
    <div>
      <h1 class="page-banner">Book Details</h1>
      <div class="page-contents">
        <ul id="result-list"></ul>
      </div>
    </div>
  </body>
  <script>
    $(document).ready(function(){
      const params = new URLSearchParams(window.location.search);
      const workID = params.get("workid");
      let request = "https://openlibrary.org" + workID + ".json";
      fetch(request)
        .then(response => response.json())
        .then(data => {
          $("<li>").text(data.title).appendTo("#result-list");
          $("<li>").text("Work ID: " + workID.substring(7)).appendTo("#result-list");
          if('description' in data && 'value' in data.description){
            $("<li>").text("Description: " + data.description.value).appendTo("#result-list");
          }
          else if('description' in data){
            $("<li>").text("Description: " + data.description).appendTo("#result-list");
          }
          if('subjects' in data){
            let subjects = "Subjects: ";
            for(i = 0; i < 10; i++){
              if(i < data.subjects.length){
                subjects += data.subjects[i] + " - ";
              }
            }
            $("<li>").text(subjects).appendTo("#result-list");
          }
          if('covers' in data){
            $("<li>").append($("<img>")
            .attr({"src": "https://covers.openlibrary.org/b/id/" + data.covers[0] + "-M.jpg"}))
            .appendTo("#result-list");
          }
          $("<li>").append($("<a>").attr("href", "https://openlibrary.org" + data.key)
            .text("Books's page on Open Library")).appendTo("#result-list");
        })
        .catch(error => {
          console.log("Error:", error);
        });
    });
  </script>
</html>
