<!DOCTYPE html>
<html>
  <head>
    <title>Book Search - Home</title>
    <link rel="stylesheet" href="m2styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <div class="navbox">
      <h2>Navigation</h2>
      <p><a href="../index.html">IT 4403 Home</a></p>
      <p><a href="book-search-home.html">Home</a></p>
      <p><a href="my-bookshelf.html">My Bookshelf</a></p>
    </div>
    <div>
      <h1 class="page-banner">Book Search</h1>
      <div class="page-contents">
        <br>
        <input type="text" id="search-text">
        <button type="button" id="search-button">Search</button>
        <label for="result-limit">Results per page:</label>
        <select id="result-limit">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
        <br>
      </div>
    </div>
  </body>
  <script>
    $(document).ready(function(){
      $("#search-button").on("click", function(){
        let searchRequest = "https://openlibrary.org/search.json?q=" + $("#search-text").val() 
          + "&limit=" + $("#result-limit").val();
        fetch(searchRequest)
          .then(response => response.json())
          .then(data => {
            $.each(data.docs, function(index, doc){
              if ('cover_i' in doc) {
                    $("<img>")
                    .attr({"src": "https://covers.openlibrary.org/b/id/" + doc.cover_i + "-S.jpg", "alt": "Cover of " + doc.title})
                    .appendTo(".page-contents");
                }
              $("<span>").text(doc.title).appendTo(".page-contents");
              $("<hr>").appendTo(".page-contents");
            })
          })
          .catch(error => {
            console.log("Error:", error);
          });
      })
    });
  </script>
</html>
